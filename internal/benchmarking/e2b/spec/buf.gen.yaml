version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/agent-substrate/substrate/agent-infra-benchmarking/internal/benchmarking/e2b/envdpb
plugins:
  - local: protoc-gen-go
    out: ../envdpb
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../envdpb
    opt: paths=source_relative
