apiVersion: v1
kind: Pod
metadata:
  name: test-openclaw
  namespace: default
spec:
  containers:
  - name: openclaw
    image: us-central1-docker.pkg.dev/akvelon-gke-aieco/ate-images-dima/openclaw:latest
    imagePullPolicy: Always
    command: ["python3", "-u", "/app/openclaw_actor.py"]
    env:
    - name: GOOGLE_CLOUD_PROJECT
      value: "akvelon-gke-aieco"
    - name: VERTEX_REGION
      value: "us-central1"
    - name: GOOGLE_CLOUD_LOCATION
      value: "us-central1"
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: "/var/secrets/google/credentials.json"
    ports:
    - containerPort: 80
    volumeMounts:
    - name: google-cloud-key
      mountPath: /var/secrets/google
      readOnly: true
  volumes:
  - name: google-cloud-key
    secret:
      secretName: openclaw-gcp-sa-key
