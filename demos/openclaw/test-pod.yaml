apiVersion: v1
kind: Pod
metadata:
  name: test-openclaw
  namespace: default
spec:
  containers:
  - name: openclaw
    image: us-docker.pkg.dev/akvelon-gke-aieco/ate-images-dima/openclaw-actor:latest
    imagePullPolicy: Always
    command: ["python3", "-u", "/app/openclaw_actor.py"]
    env:
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: openclaw-secrets
          key: OPENAI_API_KEY
    ports:
    - containerPort: 80
