name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarking/locust/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # go.mod replaces the substrate module with this submodule.
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: benchmarking/locust/go/go.mod
          cache-dependency-path: benchmarking/locust/go/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        # The tools/ scripts have no .sh extension.
        run: |
          git ls-files '*.sh' benchmarking/tools automation-infra/tools \
            | sort -u | xargs shellcheck --severity=warning

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compile
        run: python3 -m compileall -q benchmarking/scenario_runner/src benchmarking/locust/master-image benchmark-charts

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6
      - name: terraform fmt
        run: terraform fmt -check -recursive benchmarking/scenarios/infra/ benchmarking/scenario_runner/infra/
      - name: terraform validate
        run: |
          for config in benchmarking/scenarios/infra/clusters/common benchmarking/scenarios/infra/clusters/dummy \
              benchmarking/scenario_runner/infra; do
            terraform -chdir="$config" init -backend=false -input=false
            terraform -chdir="$config" validate
          done
