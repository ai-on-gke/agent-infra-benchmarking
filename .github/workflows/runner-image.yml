name: Runner image

# Builds the Cloud Run job's image, automation-infra/image/Dockerfile, from each
# pushed commit and pushes it as test-runner:<commit> to the Artifact Registry
# repository of each deployment in the matrix, then tags it
# test-runner:<branch>, which the deployment's job runs: the branch with each
# character a tag can't hold as a hyphen. The repository is the one the
# deployment's main.tf names by its project_id, region and
# default_resource_name. The workflow authenticates as
# .github/workflows/upload-source.yml does.

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token Workload Identity Federation exchanges.
      id-token: write
    strategy:
      matrix:
        deployment: [substrate-bench-auto]
    steps:
      # Only what the image holds, so its tree stays clean in git's eyes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          sparse-checkout: |
            benchmarking
            dependency-repos
            automation-infra
          # Otherwise the token ends up in the image's .git/config.
          persist-credentials: false
      - name: Deployment
        id: deployment
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
        run: |
          source automation-infra/tools/lib.sh
          DEPLOYMENT_DIR="automation-infra/deployments/$DEPLOYMENT"
          project="$(module_arg project_id)" region="$(module_arg region)" name="$(module_arg default_resource_name)"
          [[ -n "$project" && -n "$region" && -n "$name" ]] || {
            echo "$DEPLOYMENT's main.tf does not set project_id, region and default_resource_name." >&2
            exit 1
          }
          echo "registry=$region-docker.pkg.dev" >> "$GITHUB_OUTPUT"
          echo "image=$region-docker.pkg.dev/$project/$name/test-runner" >> "$GITHUB_OUTPUT"
          suffix="$(tr 'a-z-' 'A-Z_' <<<"$DEPLOYMENT")"
          echo "credentials_secret=GCP_CREDENTIALS_$suffix" >> "$GITHUB_OUTPUT"
          echo "provider_variable=GCP_WORKLOAD_IDENTITY_PROVIDER_$suffix" >> "$GITHUB_OUTPUT"
          echo "account_variable=GCP_SERVICE_ACCOUNT_$suffix" >> "$GITHUB_OUTPUT"
      # No credentials file, which would land in the build context.
      - if: vars[steps.deployment.outputs.provider_variable] != ''
        id: auth_wif
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars[steps.deployment.outputs.provider_variable] }}
          service_account: ${{ vars[steps.deployment.outputs.account_variable] }}
          token_format: access_token
          create_credentials_file: false
      - if: vars[steps.deployment.outputs.provider_variable] == ''
        id: auth_key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets[steps.deployment.outputs.credentials_secret] }} # zizmor: ignore[overprovisioned-secrets]
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.deployment.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth_wif.outputs.access_token || steps.auth_key.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: automation-infra/image/Dockerfile
          platforms: linux/amd64
          build-args: REQUIRE_CLEAN=1
          push: true
          tags: ${{ steps.deployment.outputs.image }}:${{ github.sha }}
          # In the repository, as the layers outgrow the Actions cache.
          cache-from: type=registry,ref=${{ steps.deployment.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.deployment.outputs.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          provenance: false

  # Only while the commit is the branch's tip, as upload-source.yml's
  # upload-latest, and for the same reasons.
  tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # The same as build's.
        deployment: [substrate-bench-auto]
    concurrency:
      group: ${{ github.workflow }}-tag-${{ matrix.deployment }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            automation-infra/deployments
            automation-infra/tools
          persist-credentials: false
      - name: Deployment
        id: deployment
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
        run: |
          source automation-infra/tools/lib.sh
          DEPLOYMENT_DIR="automation-infra/deployments/$DEPLOYMENT"
          project="$(module_arg project_id)" region="$(module_arg region)" name="$(module_arg default_resource_name)"
          [[ -n "$project" && -n "$region" && -n "$name" ]] || {
            echo "$DEPLOYMENT's main.tf does not set project_id, region and default_resource_name." >&2
            exit 1
          }
          echo "registry=$region-docker.pkg.dev" >> "$GITHUB_OUTPUT"
          echo "image=$region-docker.pkg.dev/$project/$name/test-runner" >> "$GITHUB_OUTPUT"
          suffix="$(tr 'a-z-' 'A-Z_' <<<"$DEPLOYMENT")"
          echo "credentials_secret=GCP_CREDENTIALS_$suffix" >> "$GITHUB_OUTPUT"
          echo "provider_variable=GCP_WORKLOAD_IDENTITY_PROVIDER_$suffix" >> "$GITHUB_OUTPUT"
          echo "account_variable=GCP_SERVICE_ACCOUNT_$suffix" >> "$GITHUB_OUTPUT"
      - if: vars[steps.deployment.outputs.provider_variable] != ''
        id: auth_wif
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars[steps.deployment.outputs.provider_variable] }}
          service_account: ${{ vars[steps.deployment.outputs.account_variable] }}
          token_format: access_token
          create_credentials_file: false
      - if: vars[steps.deployment.outputs.provider_variable] == ''
        id: auth_key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets[steps.deployment.outputs.credentials_secret] }} # zizmor: ignore[overprovisioned-secrets]
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.deployment.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth_wif.outputs.access_token || steps.auth_key.outputs.access_token }}
      - name: Tag
        env:
          IMAGE: ${{ steps.deployment.outputs.image }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Empty once the branch is deleted.
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null)" || tip=""
          if [[ "$tip" != "$COMMIT" ]]; then
            echo "$BRANCH is at ${tip:-nothing} now, leaving its tag as it is."
            exit 0
          fi
          # As the module's runner_tag.
          tag="${BRANCH//[^A-Za-z0-9_.-]/-}"
          docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE:$COMMIT"
