name: Runner image

# Builds the Cloud Run job's image, automation-infra/image/Dockerfile, from each
# pushed commit and pushes it as test-runner:<commit> to the Artifact Registry
# repository of each deployment in the matrix, with the images the job's runs
# pull, then tags it test-runner:<branch>, which the deployment's job runs: the
# branch with each character a tag can't hold as a hyphen. The repository is
# the one the deployment's main.tf names by its project_id, region and
# default_resource_name. The workflow authenticates through Workload Identity
# Federation, with the repository variables
# GCP_WORKLOAD_IDENTITY_PROVIDER_<DEPLOYMENT> and GCP_SERVICE_ACCOUNT_<DEPLOYMENT>
# that the deployment's apply sets.

on:
  push:
    branches: ['**']
  # For the runs' images of a branch no deployment tracks.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token Workload Identity Federation exchanges.
      id-token: write
    strategy:
      matrix:
        # substrate-bench-auto back once it is applied with this module, which lets
        # its GitHub account push without a key.
        deployment: [substrate-bench-staging]
    steps:
      # Only what the image holds, so its tree stays clean in git's eyes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          sparse-checkout: |
            benchmarking
            dependency-repos
            automation-infra
          # Otherwise the token ends up in the image's .git/config.
          persist-credentials: false
      - name: Deployment
        id: deployment
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
        run: |
          source automation-infra/tools/lib.sh
          DEPLOYMENT_DIR="automation-infra/deployments/$DEPLOYMENT"
          project="$(module_arg project_id)" region="$(module_arg region)" name="$(module_arg default_resource_name)"
          [[ -n "$project" && -n "$region" && -n "$name" ]] || {
            echo "$DEPLOYMENT's main.tf does not set project_id, region and default_resource_name." >&2
            exit 1
          }
          echo "registry=$region-docker.pkg.dev" >> "$GITHUB_OUTPUT"
          echo "image=$region-docker.pkg.dev/$project/$name/test-runner" >> "$GITHUB_OUTPUT"
          suffix="$(tr 'a-z-' 'A-Z_' <<<"$DEPLOYMENT")"
          echo "provider_variable=GCP_WORKLOAD_IDENTITY_PROVIDER_$suffix" >> "$GITHUB_OUTPUT"
          echo "account_variable=GCP_SERVICE_ACCOUNT_$suffix" >> "$GITHUB_OUTPUT"
      # No credentials file, which would land in the build context.
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars[steps.deployment.outputs.provider_variable] }}
          service_account: ${{ vars[steps.deployment.outputs.account_variable] }}
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.deployment.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: automation-infra/image/Dockerfile
          platforms: linux/amd64
          build-args: REQUIRE_CLEAN=1
          push: true
          tags: ${{ steps.deployment.outputs.image }}:${{ github.sha }}
          # In the repository, as the layers outgrow the Actions cache.
          cache-from: type=registry,ref=${{ steps.deployment.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.deployment.outputs.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          provenance: false

  # The images the deployment's runs pull, built with
  # benchmarking/tools/build-images for the commits of the branch its job runs,
  # source_branch in its main.tf, and of any branch dispatched by hand. Each is
  # built only if the repository lacks it: substrate's and env's once per
  # submodule version, the benchmark's own once per commit.
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # The same as build's.
        deployment: [substrate-bench-staging]
    concurrency:
      group: ${{ github.workflow }}-images-${{ matrix.deployment }}-${{ github.ref }}
    steps:
      # As build's, so git describe gives the submodules the versions the
      # runner image does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          sparse-checkout: |
            benchmarking
            dependency-repos
            automation-infra
          persist-credentials: false
      - name: Deployment
        id: deployment
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          source automation-infra/tools/lib.sh
          DEPLOYMENT_DIR="automation-infra/deployments/$DEPLOYMENT"
          project="$(module_arg project_id)" region="$(module_arg region)" name="$(module_arg default_resource_name)"
          [[ -n "$project" && -n "$region" && -n "$name" ]] || {
            echo "$DEPLOYMENT's main.tf does not set project_id, region and default_resource_name." >&2
            exit 1
          }
          # The module's default.
          tracked="$(module_arg source_branch)" tracked="${tracked:-main}"
          if [[ "$EVENT" == workflow_dispatch || "$BRANCH" == "$tracked" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "$DEPLOYMENT runs $tracked, not $BRANCH; building no images."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "repo=$region-docker.pkg.dev/$project/$name" >> "$GITHUB_OUTPUT"
          suffix="$(tr 'a-z-' 'A-Z_' <<<"$DEPLOYMENT")"
          echo "provider_variable=GCP_WORKLOAD_IDENTITY_PROVIDER_$suffix" >> "$GITHUB_OUTPUT"
          echo "account_variable=GCP_SERVICE_ACCOUNT_$suffix" >> "$GITHUB_OUTPUT"
      # substrate's ko build and the Docker builds outgrow what the runner has free.
      - if: steps.deployment.outputs.build == 'true'
        name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # The credentials file auth writes into the workspace would make the tree
      # dirty, and so the images' tag another commit's than the runner image's.
      - if: steps.deployment.outputs.build == 'true'
        run: echo 'gha-creds-*.json' >> .git/info/exclude
      - if: steps.deployment.outputs.build == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars[steps.deployment.outputs.provider_variable] }}
          service_account: ${{ vars[steps.deployment.outputs.account_variable] }}
      - if: steps.deployment.outputs.build == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - if: steps.deployment.outputs.build == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dependency-repos/substrate/go.mod
          cache-dependency-path: |
            dependency-repos/substrate/go.sum
            dependency-repos/env/go.sum
      - if: steps.deployment.outputs.build == 'true'
        name: Build
        env:
          REPO: ${{ steps.deployment.outputs.repo }}
        run: benchmarking/tools/build-images --repo="$REPO"

  # Only while the commit is the branch's tip, so that neither a run finishing
  # after a newer push's nor a rerun of an old one takes the tag back. The group
  # runs one at a time per deployment and branch: a push between the check and
  # the tag has its own job, which waits for this one and so tags last. A newer
  # push's job replaces one still waiting. And only once the images its runs
  # pull are there, so the job never runs a commit whose images are missing.
  tag:
    needs: [build, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # The same as build's.
        deployment: [substrate-bench-staging]
    concurrency:
      group: ${{ github.workflow }}-tag-${{ matrix.deployment }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            automation-infra/deployments
            automation-infra/tools
          persist-credentials: false
      - name: Deployment
        id: deployment
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
        run: |
          source automation-infra/tools/lib.sh
          DEPLOYMENT_DIR="automation-infra/deployments/$DEPLOYMENT"
          project="$(module_arg project_id)" region="$(module_arg region)" name="$(module_arg default_resource_name)"
          [[ -n "$project" && -n "$region" && -n "$name" ]] || {
            echo "$DEPLOYMENT's main.tf does not set project_id, region and default_resource_name." >&2
            exit 1
          }
          echo "registry=$region-docker.pkg.dev" >> "$GITHUB_OUTPUT"
          echo "image=$region-docker.pkg.dev/$project/$name/test-runner" >> "$GITHUB_OUTPUT"
          suffix="$(tr 'a-z-' 'A-Z_' <<<"$DEPLOYMENT")"
          echo "provider_variable=GCP_WORKLOAD_IDENTITY_PROVIDER_$suffix" >> "$GITHUB_OUTPUT"
          echo "account_variable=GCP_SERVICE_ACCOUNT_$suffix" >> "$GITHUB_OUTPUT"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars[steps.deployment.outputs.provider_variable] }}
          service_account: ${{ vars[steps.deployment.outputs.account_variable] }}
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.deployment.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Tag
        env:
          IMAGE: ${{ steps.deployment.outputs.image }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Empty once the branch is deleted.
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null)" || tip=""
          if [[ "$tip" != "$COMMIT" ]]; then
            echo "$BRANCH is at ${tip:-nothing} now, leaving its tag as it is."
            exit 0
          fi
          # As the module's runner_tag.
          tag="${BRANCH//[^A-Za-z0-9_.-]/-}"
          docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE:$COMMIT"
