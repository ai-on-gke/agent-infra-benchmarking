name: Publish

# Builds the Cloud Run job's image, automation-infra/image/Dockerfile, from each
# commit pushed to main, or the branch dispatched by hand, and pushes it as
# runner:<commit> to the Artifact Registry repository of each deployment in the
# matrix, with the images the job's runs pull, then tags it runner:<branch>,
# which the deployment's job runs: the branch with each character a tag can't
# hold as a hyphen. The deployment's apply sets the GitHub repository variables
# the workflow reads: GCP_REPOSITORY_<DEPLOYMENT>, the Artifact Registry
# repository, and GCP_WORKLOAD_IDENTITY_PROVIDER_<DEPLOYMENT> and
# GCP_SERVICE_ACCOUNT_<DEPLOYMENT>, which it authenticates with through Workload
# Identity Federation.

on:
  # The branch the deployments' jobs run.
  push:
    branches: [main]
  # For the runs' images of any other branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token Workload Identity Federation exchanges.
      id-token: write
    strategy:
      matrix:
        deployment: [substrate-bench-auto, substrate-bench-staging]
    steps:
      # Only what the image holds, so its tree stays clean in git's eyes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          sparse-checkout: |
            benchmarking
            dependency-repos
            automation-infra
          # Otherwise the token ends up in the image's .git/config.
          persist-credentials: false
      - name: Deployment
        id: deployment
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
          VARS: ${{ toJSON(vars) }}
        run: |
          suffix="$(tr 'a-z-' 'A-Z_' <<<"$DEPLOYMENT")"
          var() { jq -r --arg name "$1_$suffix" '.[$name] // empty' <<<"$VARS"; }
          repository="$(var GCP_REPOSITORY)" provider="$(var GCP_WORKLOAD_IDENTITY_PROVIDER)" account="$(var GCP_SERVICE_ACCOUNT)"
          [[ -n "$repository" && -n "$provider" && -n "$account" ]] || {
            echo "GCP_REPOSITORY_$suffix, GCP_WORKLOAD_IDENTITY_PROVIDER_$suffix and GCP_SERVICE_ACCOUNT_$suffix are not all set; $DEPLOYMENT's apply sets them." >&2
            exit 1
          }
          {
            echo "registry=${repository%%/*}"
            echo "repository=$repository"
            echo "provider=$provider"
            echo "account=$account"
          } >> "$GITHUB_OUTPUT"
      # No credentials file, which would land in the build context.
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.deployment.outputs.provider }}
          service_account: ${{ steps.deployment.outputs.account }}
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.deployment.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: automation-infra/image/Dockerfile
          platforms: linux/amd64
          build-args: REQUIRE_CLEAN=1
          push: true
          tags: ${{ steps.deployment.outputs.repository }}/runner:${{ github.sha }}
          # In the repository, as the layers outgrow the Actions cache.
          cache-from: type=registry,ref=${{ steps.deployment.outputs.repository }}/runner:buildcache
          cache-to: type=registry,ref=${{ steps.deployment.outputs.repository }}/runner:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          provenance: false

  # The images the deployment's runs pull, built with
  # benchmarking/tools/build-images. Each is built only if the repository lacks
  # it: substrate's and env's once per submodule version, the benchmark's own
  # once per commit.
  benchmark-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # The same as runner-image's.
        deployment: [substrate-bench-auto, substrate-bench-staging]
    concurrency:
      group: ${{ github.workflow }}-benchmark-images-${{ matrix.deployment }}-${{ github.ref }}
    steps:
      # As runner-image's, so git describe gives the submodules the
      # versions the runner image does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          sparse-checkout: |
            benchmarking
            dependency-repos
            automation-infra
          persist-credentials: false
      - name: Deployment
        id: deployment
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
          VARS: ${{ toJSON(vars) }}
        run: |
          suffix="$(tr 'a-z-' 'A-Z_' <<<"$DEPLOYMENT")"
          var() { jq -r --arg name "$1_$suffix" '.[$name] // empty' <<<"$VARS"; }
          repository="$(var GCP_REPOSITORY)" provider="$(var GCP_WORKLOAD_IDENTITY_PROVIDER)" account="$(var GCP_SERVICE_ACCOUNT)"
          [[ -n "$repository" && -n "$provider" && -n "$account" ]] || {
            echo "GCP_REPOSITORY_$suffix, GCP_WORKLOAD_IDENTITY_PROVIDER_$suffix and GCP_SERVICE_ACCOUNT_$suffix are not all set; $DEPLOYMENT's apply sets them." >&2
            exit 1
          }
          {
            echo "registry=${repository%%/*}"
            echo "repository=$repository"
            echo "provider=$provider"
            echo "account=$account"
          } >> "$GITHUB_OUTPUT"
      # substrate's ko build and the Docker builds outgrow what the runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # The credentials file auth writes into the workspace would make the tree
      # dirty, and so the images' tag another commit's than the runner image's.
      - run: echo 'gha-creds-*.json' >> .git/info/exclude
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.deployment.outputs.provider }}
          service_account: ${{ steps.deployment.outputs.account }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dependency-repos/substrate/go.mod
          cache-dependency-path: |
            dependency-repos/substrate/go.sum
            dependency-repos/env/go.sum
      # The Actions cache for the Docker builds, which takes a docker-container
      # builder and the runtime variables only actions see otherwise.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build
        env:
          REPO: ${{ steps.deployment.outputs.repository }}
        run: |
          benchmarking/tools/build-images --repo="$REPO" \
            --cache-from='type=gha,scope={image}' --cache-to='type=gha,scope={image},mode=max'

  # Only while the commit is the branch's tip, so that neither a run finishing
  # after a newer push's nor a rerun of an old one takes the tag back. The group
  # runs one at a time per deployment and branch: a push between the check and
  # the tag has its own job, which waits for this one and so tags last. A newer
  # push's job replaces one still waiting. And only once the images its runs
  # pull are there, so the job never runs a commit whose images are missing.
  tag-runner:
    needs: [runner-image, benchmark-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # The same as runner-image's.
        deployment: [substrate-bench-auto, substrate-bench-staging]
    concurrency:
      group: ${{ github.workflow }}-tag-runner-${{ matrix.deployment }}-${{ github.ref }}
    steps:
      - name: Deployment
        id: deployment
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
          VARS: ${{ toJSON(vars) }}
        run: |
          suffix="$(tr 'a-z-' 'A-Z_' <<<"$DEPLOYMENT")"
          var() { jq -r --arg name "$1_$suffix" '.[$name] // empty' <<<"$VARS"; }
          repository="$(var GCP_REPOSITORY)" provider="$(var GCP_WORKLOAD_IDENTITY_PROVIDER)" account="$(var GCP_SERVICE_ACCOUNT)"
          [[ -n "$repository" && -n "$provider" && -n "$account" ]] || {
            echo "GCP_REPOSITORY_$suffix, GCP_WORKLOAD_IDENTITY_PROVIDER_$suffix and GCP_SERVICE_ACCOUNT_$suffix are not all set; $DEPLOYMENT's apply sets them." >&2
            exit 1
          }
          {
            echo "registry=${repository%%/*}"
            echo "repository=$repository"
            echo "provider=$provider"
            echo "account=$account"
          } >> "$GITHUB_OUTPUT"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.deployment.outputs.provider }}
          service_account: ${{ steps.deployment.outputs.account }}
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.deployment.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Tag
        env:
          IMAGE: ${{ steps.deployment.outputs.repository }}/runner
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Empty once the branch is deleted.
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null)" || tip=""
          if [[ "$tip" != "$COMMIT" ]]; then
            echo "$BRANCH is at ${tip:-nothing} now, leaving its tag as it is."
            exit 0
          fi
          # As the module's runner_tag.
          tag="${BRANCH//[^A-Za-z0-9_.-]/-}"
          docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE:$COMMIT"
