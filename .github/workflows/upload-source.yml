name: Upload source

# Uploads each pushed commit, as a git repo, to
# gs://<SOURCE_BUCKET>/source/<branch>/<commit>.tar.gz. The secrets come from
# automation-infra/scripts/get-gh-actions-gcs-config.

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          # Otherwise the token ends up in the tarball's .git/config.
          persist-credentials: false
      # Before auth, which writes the key into the workspace.
      - name: Pack
        run: tar -czf "$RUNNER_TEMP/source.tar.gz" -C "$GITHUB_WORKSPACE" .
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Upload
        env:
          BUCKET: ${{ secrets.SOURCE_BUCKET }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          # A parallel composite upload's parts would go under gcloud/tmp/,
          # and the key may only write under source/.
          CLOUDSDK_STORAGE_PARALLEL_COMPOSITE_UPLOAD_ENABLED: "False"
        run: gcloud storage cp "$RUNNER_TEMP/source.tar.gz" "gs://$BUCKET/source/$BRANCH/$COMMIT.tar.gz"
