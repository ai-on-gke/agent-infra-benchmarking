# Named benchmark runs, each picked by the scenario-runner's --scenario:
#
#   python3 -m scenario_runner.cli.run --scenario glutton ...
#
# `type` picks scenario_runner/src/scenario_runner/<type>.py, which documents
# the rest.
# For locust: `worker-count` and `sandbox-class` shape the WorkerPool, and
# every key in `master` and `worker` becomes `--key=value` on that process.
# `sandbox-class` has to be the cluster's `sandbox_class`, gvisor by default.
# `noop` is the scenario-runner's alone: it applies and destroys the case's
# cluster, and runs nothing on it.
#
# `repeats` is how many times the case runs, 1 by default, each on its own
# cluster applied for it, or one after another on a --dev-infra's. Above 1,
# they are recorded as <case>-1 to <case>-N.
#
# The scenario-runner installs substrate on the case's cluster before running
# it, unless `skip-substrate-install` is true.
#
# `infra.cluster` is the cluster the case runs on. `name` picks the Terraform
# config in infra/clusters/<name>/, and the rest is optional: `tfvars` a tfvars
# file in that config (or an absolute path), `tfvars_inline` tfvars content, and
# `variables` values passed as TF_VAR_<key>.
#
# Varying the load or the pool means another case, so that every run is
# reproducible from the name it is recorded under: benchmark-test-case is the
# pod label, and test_case the Prometheus label relabeled from it.

cases:
  glutton:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: default.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 1
          sandboxed_min_node_count = 1
          sandboxed_max_node_count = 1
    repeats: 3
    worker-count: 10
    sandbox-class: gvisor
    master:
      run-time: 1m
      users: 10
      spawn-rate: 10
      warm-up: 10s
    worker:
      workload-name: glutton
      workload-template: glutton
      resume-mode: explicit

  glutton-microvm:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: default.tfvars
        tfvars_inline: |
          sandbox_class            = "microvm"
          sandboxed_node_count     = 1
          sandboxed_min_node_count = 1
          sandboxed_max_node_count = 1
    worker-count: 5
    sandbox-class: microvm
    master:
      run-time: 3m
      users: 3
      spawn-rate: 2
    worker:
      workload-name: glutton
      workload-template: glutton
      resume-mode: explicit

  glutton-baseline:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: default.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 1
          sandboxed_min_node_count = 1
          sandboxed_max_node_count = 1
    worker-count: 100
    sandbox-class: gvisor
    master:
      run-time: 3m
      users: 100
      spawn-rate: 10
    worker:
      workload-name: glutton
      workload-template: glutton
      resume-mode: explicit
      suspend-disabled: true

  glutton-utilization-10:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: default.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 10
          sandboxed_min_node_count = 10
          sandboxed_max_node_count = 10
    worker-count: 100
    sandbox-class: gvisor
    master:
      run-time: 3m
      users: 100
      spawn-rate: 10
    worker:
      workload-name: glutton
      workload-template: glutton
      resume-mode: explicit
      suspend-disabled: false
      min-wait: 6000ms
      max-wait: 6000ms

  glutton-utilization-25:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: default.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 10
          sandboxed_min_node_count = 10
          sandboxed_max_node_count = 10
    worker-count: 100
    sandbox-class: gvisor
    master:
      run-time: 3m
      users: 250
      spawn-rate: 10
    worker:
      workload-name: glutton
      workload-template: glutton
      resume-mode: explicit
      suspend-disabled: false
      min-wait: 6000ms
      max-wait: 6000ms

  glutton-utilization-50:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: default.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 10
          sandboxed_min_node_count = 10
          sandboxed_max_node_count = 10
    worker-count: 100
    sandbox-class: gvisor
    master:
      run-time: 3m
      users: 500
      spawn-rate: 10
    worker:
      workload-name: glutton
      workload-template: glutton
      resume-mode: explicit
      suspend-disabled: false
      min-wait: 6000ms
      max-wait: 6000ms

  openclaw:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: openclaw.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 1
          sandboxed_min_node_count = 1
          sandboxed_max_node_count = 1
    repeats: 3
    worker-count: 10
    sandbox-class: gvisor
    master:
      run-time: 1m
      users: 10
      spawn-rate: 10
      warm-up: 10s
    worker:
      workload-name: openclaw
      workload-template: openclaw
      workload-timeout: 120s
      resume-mode: explicit
      actor-egress-allow: "mock-llm.benchmark-workloads.svc.cluster.local"

  openclaw-baseline:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: openclaw.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 10
          sandboxed_min_node_count = 10
          sandboxed_max_node_count = 10
    worker-count: 100
    sandbox-class: gvisor
    master:
      run-time: 5m
      users: 100
      spawn-rate: 10
    worker:
      workload-name: openclaw
      workload-template: openclaw
      workload-timeout: 120s
      resume-mode: explicit
      suspend-disabled: true
      actor-egress-allow: "mock-llm.benchmark-workloads.svc.cluster.local"

  openclaw-utilization-10:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: openclaw.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 10
          sandboxed_min_node_count = 10
          sandboxed_max_node_count = 10
    worker-count: 100
    sandbox-class: gvisor
    master:
      run-time: 5m
      users: 100
      spawn-rate: 10
    worker:
      workload-name: openclaw
      workload-template: openclaw
      workload-timeout: 120s
      resume-mode: explicit
      suspend-disabled: false
      min-wait: 106000ms
      max-wait: 106000ms
      actor-egress-allow: "mock-llm.benchmark-workloads.svc.cluster.local"

  openclaw-utilization-25:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: openclaw.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 10
          sandboxed_min_node_count = 10
          sandboxed_max_node_count = 10
    worker-count: 100
    sandbox-class: gvisor
    master:
      run-time: 10m
      users: 250
      spawn-rate: 3
    worker:
      workload-name: openclaw
      workload-template: openclaw
      workload-timeout: 120s
      resume-mode: explicit
      suspend-disabled: false
      min-wait: 106000ms
      max-wait: 106000ms
      actor-egress-allow: "mock-llm.benchmark-workloads.svc.cluster.local"

  openclaw-utilization-50:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: openclaw.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 10
          sandboxed_min_node_count = 10
          sandboxed_max_node_count = 10
    worker-count: 100
    sandbox-class: gvisor
    master:
      run-time: 10m
      users: 500
      spawn-rate: 3
    worker:
      workload-name: openclaw
      workload-template: openclaw
      workload-timeout: 120s
      resume-mode: explicit
      suspend-disabled: false
      min-wait: 106000ms
      max-wait: 106000ms
      actor-egress-allow: "mock-llm.benchmark-workloads.svc.cluster.local"

  # The scenario-runner's Terraform path on infra/clusters/dummy, which creates
  # no GCP resources and so has nothing to benchmark on.
  dummy:
    type: noop
    repeats: 3
    skip-substrate-install: true
    infra:
      cluster:
        name: dummy
        tfvars_inline: |
          sandboxed_node_count     = 10
          sandboxed_min_node_count = 10
          sandboxed_max_node_count = 10
