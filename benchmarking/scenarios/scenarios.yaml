# Named benchmark runs, each picked by the scenario-runner's --scenario, those
# of a suite below with --suite, or all of them with --all:
#
#   python3 -m scenario_runner.cli.run --scenario glutton-substrate-gvisor ...
#
# A case's type is the key of the one mapping in it of the type's own keys,
# `locust`, `sandbox-benchmark` or `noop`; the rest of the case is the
# scenario-runner's. The type's module in
# scenario_runner/src/scenario_runner/benchmarks/, '-' spelled '_', documents
# the type's keys.
# For locust: `workers` and the `sandbox-class` in its `install` shape the
# WorkerPool, and every key in `master` and `worker` becomes `--key=value` on
# that process. `workers.count` is the pool's workers, 1 by default, and
# `workers.limits`, substrate's only, each worker's `cpu` and `memory`: the
# room its actors share, as substrate places an actor only on a worker whose
# actors leave room for its own limits. A worker without them has room for any
# number. `actor-memory` is the actors' memory limit, which on microvm is
# the guest's RAM: 256Mi by default, 2Gi for openclaw. `locust-workers` is how
# many boomer worker pods share the users, 1 by default. `user-class` is the
# load they put on, runworkload by default: the master's
# locust/master-image/tests/<user-class>.py and the worker's --user-class.
# For sandbox-benchmark: `tests` names ai-sandbox-benchmark's tests by function
# name, run `runs` times each. `provider.name` runs them on substrate, the
# default, local, e2b, daytona, modal, anthropic or openai. The cloud ones need
# their API keys in the scenario-runner's environment,
# sandbox_benchmark.PROVIDER_KEYS. substrate's `env-worker-count`,
# `actor-memory` and `actor-cpu`, beside its name, size env's WorkerPool and its
# environments; `actor-cpu` is "2" by default. e2b's, modal's and daytona's
# `cpu` and `memory` size their sandboxes, theirs by default; e2b's in whole
# vCPUs, through a template of that size it builds once, daytona's in whole vCPUs
# and GiB; openai's `container-size` picks its tier, small, medium or large. The
# cost sheet prices each sandbox at its size. A
# case's variants' results are combined into one comparison, the first variant
# the others are compared with: perf_results.csv, and with `cost-sheet: true`
# cost_sheet.csv, the sandbox cost sheet.
# `noop` is the scenario-runner's alone, and holds its `infra` and `install` at
# most: it applies and destroys the case's cluster, and runs nothing on it.
#
# `parameters` makes a case of each choice of one entry from every one of its
# lists, in their order: the case with the entry's values in its placeholders,
# `{name}` in its name or any of its keys or values. A value that is one
# placeholder takes the entry's value as it is, null dropping its key, and null
# when the entry does not set it; one in a longer value or in a key, as in the
# name, takes its text, which every entry has to set. The case's variants are
# part of it, their placeholders filled in too. A placeholder none of the
# entries sets, or a name an entry sets that no placeholder has, is refused.
# Each case so made is one of its own.
#
# `variants` makes a case of each of its entries, <case>-<variant>: the case,
# already made of its parameters, with the entry's keys on top, a mapping
# merged into a mapping, a key set to null dropped.
# --scenario <case> runs them all one after another, then the type's summary of
# them all; --scenario <case>-<variant> just that one. Those alike in their
# cluster share one, applied for them all.
#   python3 -m scenario_runner.cli.cases glutton-density
# prints a case made of its parameters, its variants with theirs in them.
#
# `max-failure-ratio`, in the type's mapping, is the share of cycles, 0 to 1,
# that may fail before a run of the case counts as failed, 0.01 by default. A
# cycle fails on any of its calls, and an actor that could not be created
# counts as a failed cycle. A run that completes no cycle, or whose load
# generator raises any exception, fails too. For sandbox-benchmark it is the
# share of test runs.
#
# `repeats` is how the case is sampled, all of it optional:
#   count    the runs that are measured, 1 by default; above 1 recorded as
#            <case>-1 to <case>-N
#   warmups  runs before them that are not, 1 by default, recorded as
#            <case>-warmup-1 to <case>-warmup-N and left out of the summary;
#            one that fails only warns
#   cluster  `shared`, the default, for all of them one after another on one
#            cluster applied for the case, or `per-repeat` for each measured
#            run on a cluster of its own, with no warm-ups. On a --dev-infra
#            they all run on its cluster either way.
#
# `install`, in the type's mapping, is what the scenario-runner installs on the
# case's cluster before running it, each by its name with its own settings;
# nothing when left out.
# It names one control plane at most:
#   substrate      `sandbox-class`, gvisor or microvm, which substrate is
#                  installed with and the case's workers run on
#   agent-sandbox  `sandbox-class`, gvisor only, the RuntimeClass its pods ask
#                  for, which GKE Sandbox runs them in
# locust runs on either, sandbox-benchmark's substrate provider on substrate,
# and its others on any. microvm's guests boot on /dev/kvm, which the cluster
# has with `infra.cluster.nested-virtualization: true` or on bare metal.
# agent-sandbox's pods need `infra.cluster.gke-sandbox: true`, and the
# scenario-runner fails the run if any of them is not in gVisor.
#
# `infra.cluster`, in the type's mapping, is the cluster the case runs on: its
# `configuration` and that configuration's inputs, which
# scenario_runner/src/scenario_runner/infra/cluster_configs.py turns into the
# Terraform variables of the infra/clusters/ config it applies, all of them
# optional:
#   configuration           common, the default, a GKE cluster from
#                           infra/clusters/common; openclaw, common's with a
#                           pool for mock-llm, which openclaw's workload needs;
#                           or dummy, infra/clusters/dummy, for a noop only
#   sandboxed-nodes         the sandboxed pool's nodes, 1 by default, which it
#                           is pinned at
#   sandboxed-max-nodes     the most it autoscales up to, if it does
#   sandboxed-machine-type  its machine type, c2-standard-16 by default
#   sandboxed-disk-size-gb  its nodes' boot disk in GB, 100 by default, where
#                           substrate writes snapshots
#   zone                    the zone of every pool, the config's by default
#   nested-virtualization   true for /dev/kvm on the sandboxed pool off bare
#                           metal, which a microvm case's guests boot on; off by
#                           default, and only on Intel machine families
#   gke-sandbox             true for GKE Sandbox on the sandboxed pool, for an
#                           agent-sandbox case only, and needed by one; off by
#                           default
#   default-machine-type    common's and openclaw's default pool's,
#                           c2-standard-16 by default
# locust runs on common or openclaw, sandbox-benchmark on common, and a noop on
# any of them.
#
# Varying the load or the pool means another case, so that every run is
# reproducible from the name it is recorded under: benchmark-test-case is the
# pod label, and test_case the Prometheus label relabeled from it.
#
# `bare-metal: true` runs the case's sandboxed pool on bare metal, recorded as
# <case>-metal, and so are its repeats and warm-ups. A case that does not say
# takes `bare-metal.default` below, and the scenario-runner's --bare-metal or
# --no-bare-metal overrides both; neither puts a noop on bare metal. The pool
# goes on the first of `bare-metal.placements` in the run's --region, its zone
# then the whole cluster's; a zone out of that machine type moves it, destroyed
# first, to the next, and the cases after it start from the one it got. GKE
# takes only C3's -metal types, each 192 vCPUs, so the region's C3 CPU quota
# sets how many nodes fit.
bare-metal:
  default: false
  placements:
  - zone: us-central1-a
    machine-type: c3-standard-192-metal
  - zone: us-central1-c
    machine-type: c3-highcpu-192-metal
  - zone: us-central1-a
    machine-type: c3-highmem-192-metal

# `suites` lists cases by name, as --scenario takes them, for --suite to run in
# that order. The automation-infra deployments run one each, so a case is added
# to or dropped from their scheduled runs here, without applying them again.
suites:
  # substrate-bench-auto's nightly.
  nightly:
  - glutton-substrate-gvisor
  - glutton-substrate-microvm
  - openclaw-substrate-gvisor
  - openclaw-substrate-microvm
  - glutton-agent-sandbox-gvisor
  - openclaw-agent-sandbox-gvisor
  - dummy
  # substrate-bench-staging's: dummy, which creates no cluster, and
  # glutton-single, one glutton run.
  staging:
  - dummy
  - glutton-single

cases:
  # Each workload at 300 VUs (virtual users) on 300 workers over 30 nodes for
  # 4m, measured once, its VUs started 10 a second and each actor woken by a
  # ResumeActor first: on substrate's gvisor, and on its microvm with the nested
  # virtualization it boots its guests on, alike but for what they run on, so
  # they compare.
  "{workload}-{control-plane}-{sandbox-class}":
    repeats:
      count: 1
    locust:
      install:
        "{control-plane}":
          sandbox-class: "{sandbox-class}"
      infra:
        cluster:
          sandboxed-nodes: 30
          # openclaw's 2Gi snapshots saturate a 100GB disk's writes on microvm.
          sandboxed-disk-size-gb: 1000
          configuration: "{configuration}"
          nested-virtualization: "{nested-virtualization}"
      workers:
        count: 300
      master:
        run-time: "4m"
        users: 300
        spawn-rate: 10
        warm-up: 1m
      worker:
        resume-mode: explicit
        workload-name: "{workload}"
        workload-template: "{workload}"
        workload-timeout: "{workload-timeout}"
        actor-egress-allow: "{actor-egress-allow}"
    parameters:
      workload:
      - workload: glutton
      # On the cluster with mock-llm.
      - workload: openclaw
        configuration: openclaw
        # The actors end a turn 20s sooner, at 220s. A turn takes about twice as
        # long with 10 actors on a node as on an idle one, and on microvm runs
        # past 100s.
        workload-timeout: 240s
        # Without an egress policy the actors can't reach mock-llm.
        actor-egress-allow: mock-llm.benchmark-workloads.svc.cluster.local
      class:
      - control-plane: substrate
        sandbox-class: gvisor
      - control-plane: substrate
        sandbox-class: microvm
        nested-virtualization: true

  # The same on agent-sandbox, its pods in GKE Sandbox's gVisor, but glutton at
  # 30 VUs on 30 workers: each of its cycles starts a new pod, and with more VUs
  # its claims can wait past their timeout for one.
  "{workload}-agent-sandbox-gvisor":
    repeats:
      count: 1
    locust:
      install:
        agent-sandbox:
          sandbox-class: gvisor
      infra:
        cluster:
          sandboxed-nodes: 30
          sandboxed-disk-size-gb: 1000
          configuration: "{configuration}"
          gke-sandbox: true
      workers:
        count: "{vus}"
      master:
        run-time: "4m"
        users: "{vus}"
        spawn-rate: 10
        warm-up: 1m
      worker:
        resume-mode: explicit
        workload-name: "{workload}"
        workload-template: "{workload}"
        workload-timeout: "{workload-timeout}"
        actor-egress-allow: "{actor-egress-allow}"
    parameters:
      workload:
      - workload: glutton
        vus: 30
      - workload: openclaw
        vus: 300
        configuration: openclaw
        workload-timeout: 240s
        actor-egress-allow: mock-llm.benchmark-workloads.svc.cluster.local

  # glutton at 10 VUs on 10 workers on one node, once with no warm-up, for a
  # quicker check of the path.
  glutton-single:
    repeats:
      warmups: 0
    locust:
      install:
        substrate:
          sandbox-class: gvisor
      infra:
        cluster:
          sandboxed-nodes: 1
      workers:
        count: 10
      master:
        run-time: 5m
        users: 10
        spawn-rate: 10
        warm-up: 10s
      worker:
        resume-mode: explicit
        workload-name: glutton
        workload-template: glutton

  # glutton-single's load and cluster, so it runs on the same dev infra, on 2
  # workers rather than 10, each with room for 6 of its 256Mi actors: its 10
  # VUs' actors can only all be placed by sharing them.
  glutton-shared-workers:
    repeats:
      warmups: 0
    locust:
      install:
        substrate:
          sandbox-class: gvisor
      infra:
        cluster:
          sandboxed-nodes: 1
      workers:
        count: 2
        limits:
          memory: 1536Mi
      master:
        run-time: 5m
        users: 10
        spawn-rate: 10
        warm-up: 10s
      worker:
        resume-mode: explicit
        workload-name: glutton
        workload-template: glutton

  # 100 workers on 10 nodes, suspended between instructions, at 100, 250 and
  # 500 VUs, the variants named for their actors per node, against a baseline
  # of 100 that never suspend. The density user class paces each actor to be
  # in a cycle for `active-actors` over the VUs of its time, so every variant
  # that suspends keeps 80 actors active at once, whatever the workload's turn
  # takes, and only the actors they are shared among grows; while the VUs ramp
  # up to 80, every one of them is in a cycle all along. Each worker has room
  # for one actor, its actor-memory, so the actors share the 100 workers
  # rather than pile onto them.
  #
  # The variants differ in their VUs alone, and in the spawn rate that grows
  # with them, so each ramps up in 100s. Every variant of either workload then
  # runs on the same times: a warm-up of 1m after the last VU starts, and a
  # steady window of the 160s left, so their percentiles rest on about as many
  # cycles. The warm-up is shorter than a turn openclaw's own timeout, 100s,
  # cuts off, so its window may start with turns begun during the ramp.
  "{workload}-density":
    locust:
      user-class: density
      actor-memory: "{actor-memory}"
      install:
        substrate:
          sandbox-class: gvisor
      infra:
        cluster:
          sandboxed-nodes: 10
          configuration: "{configuration}"
      workers:
        count: 100
        limits:
          memory: "{actor-memory}"
      master:
        run-time: 5m20s
        spawn-rate: 1
        warm-up: 1m
      worker:
        resume-mode: explicit
        suspend-disabled: false
        active-actors: 80
        workload-name: "{workload}"
        workload-template: "{workload}"
        workload-timeout: "{workload-timeout}"
        actor-egress-allow: "{actor-egress-allow}"
    variants:
      # Paced as if its cycles took the resume and suspend they skip, so it
      # sends instructions at the rate of 10.
      baseline:
        locust:
          master: {users: 100}
          worker: {suspend-disabled: true, skipped-resume-suspend: "{skipped-resume-suspend}"}
      "10":
        locust:
          master: {users: 100}
      "25":
        locust:
          master: {users: 250, spawn-rate: 2.5}
      "50":
        locust:
          master: {users: 500, spawn-rate: 5}
    parameters:
      workload:
      # Its median Resume and Suspend, 290ms and 460ms, on
      # glutton-substrate-gvisor.
      - workload: glutton
        actor-memory: 256Mi
        skipped-resume-suspend: 750ms
      # No skipped-resume-suspend until a run has measured them: its turn makes
      # up most of its cycle.
      - workload: openclaw
        actor-memory: 2Gi
        configuration: openclaw
        workload-timeout: 120s
        actor-egress-allow: mock-llm.benchmark-workloads.svc.cluster.local

  # glutton woken by its instruction, through the router, rather than by a
  # ResumeActor first: TTFI is then the router's wake.
  glutton-implicit:
    locust:
      install:
        substrate:
          sandbox-class: gvisor
      infra:
        cluster:
          sandboxed-nodes: 1
      workers:
        count: 10
      master:
        run-time: 5m
        users: 10
        spawn-rate: 10
        warm-up: 10s
      worker:
        resume-mode: implicit
        workload-name: glutton
        workload-template: glutton

  # glutton with memory and disk to snapshot: each cycle rewrites 64Mi of the
  # actor's memory and a 16Mi file before its suspend (WriteRAM and WriteDisk
  # rows).
  glutton-load:
    locust:
      install:
        substrate:
          sandbox-class: gvisor
      infra:
        cluster:
          sandboxed-nodes: 1
      workers:
        count: 10
      actor-memory: 512Mi
      master:
        run-time: 5m
        users: 10
        spawn-rate: 10
        warm-up: 10s
      worker:
        resume-mode: explicit
        workload-name: glutton
        workload-template: glutton
        glutton-write-ram: 64Mi
        glutton-write-disk: 16777216

  # A session of five instructions per wake, rather than one.
  glutton-session:
    locust:
      install:
        substrate:
          sandbox-class: gvisor
      infra:
        cluster:
          sandboxed-nodes: 1
      workers:
        count: 10
      master:
        run-time: 5m
        users: 10
        spawn-rate: 10
        warm-up: 10s
      worker:
        resume-mode: explicit
        workload-name: glutton
        workload-template: glutton
        instructions-per-cycle: 5

  # Four instructions at once to each actor at every step.
  glutton-concurrent:
    locust:
      install:
        substrate:
          sandbox-class: gvisor
      infra:
        cluster:
          sandboxed-nodes: 1
      workers:
        count: 10
      master:
        run-time: 5m
        users: 10
        spawn-rate: 10
        warm-up: 10s
      worker:
        resume-mode: explicit
        workload-name: glutton
        workload-template: glutton
        concurrent-instructions: 4

  # glutton at scale: 100 VUs on 100 workers over 25 sandboxed nodes, the
  # load spread over four boomer pods. Its 26 c2-standard-16 nodes take 416 of
  # a region's default 500 C2 vCPUs, so it runs by hand rather than nightly.
  glutton-large:
    repeats:
      count: 3
    locust:
      install:
        substrate:
          sandbox-class: gvisor
      infra:
        cluster:
          sandboxed-nodes: 25
      workers:
        count: 100
      locust-workers: 4
      master:
        run-time: 5m
        users: 100
        spawn-rate: 10
        warm-up: 10s
      worker:
        resume-mode: explicit
        workload-name: glutton
        workload-template: glutton

  # substrate against the cloud providers, and the sandbox cost sheet from
  # their suspend and resume overheads. The sandboxes that can be sized are
  # alike, 2 vCPU and 2 GiB; those that cannot say so. local, no sandbox at
  # all, is the harness's own floor.
  sandbox-benchmark:
    # A warm-up would run every provider, paid ones too; warmup-runs is the
    # cheaper way to warm them up.
    repeats:
      warmups: 0
    sandbox-benchmark:
      install:
        substrate:
          sandbox-class: gvisor
      infra:
        cluster:
          sandboxed-nodes: 1
          # The cost sheet prices substrate at its rates.
          sandboxed-machine-type: n2-standard-16
      cost-sheet: true
      tests:
      - test_suspend_resume
      runs: 10
      warmup-runs: 1
    variants:
      substrate:
        sandbox-benchmark:
          provider:
            name: substrate
            # The comparator starts every run at once, each in an environment
            # of its own on a worker of its own: 10 sandboxes capped at 2 vCPU
            # on the node's 16, which contend only while most are busy at once.
            env-worker-count: 10
            actor-cpu: "2"
            actor-memory: 2Gi
      # e2b, modal, daytona, anthropic and openai need E2B_API_KEY,
      # MODAL_TOKEN_ID/MODAL_TOKEN_SECRET, DAYTONA_API_KEY, ANTHROPIC_API_KEY
      # and OPENAI_API_KEY in the scenario-runner's environment.
      # Not sized: no sandbox, the tests run in the comparator's own pod.
      local: {sandbox-benchmark: {provider: {name: local}}}
      e2b: {sandbox-benchmark: {provider: {name: e2b, cpu: "2", memory: 2Gi}}}
      modal: {sandbox-benchmark: {provider: {name: modal, cpu: "2", memory: 2Gi}}}
      daytona: {sandbox-benchmark: {provider: {name: daytona, cpu: "2", memory: 2Gi}}}
      # Cannot be sized: Managed Agents' cloud environments take no cpu or
      # memory, and give every session a sandbox of 2 vCPU and 4 GB.
      anthropic: {sandbox-benchmark: {provider: {name: anthropic}}}
      # Cannot be sized to match: OpenAI's hosted environments take only a
      # container-size tier, none of them 2 vCPU and 2 GiB: small is 1 vCPU and
      # 1 GB, medium, OpenAI's default and the nearest, 2 vCPU and 4 GB, and
      # large 4 vCPU and 16 GB. See
      # https://developers.openai.com/api/docs/guides/agents-api/environments/openai-hosted
      openai: {sandbox-benchmark: {provider: {name: openai, container-size: medium}}}

  # The scenario-runner's Terraform path on infra/clusters/dummy, which creates
  # no GCP resources and so has nothing to benchmark on.
  dummy:
    # A cluster each, so the path is applied and destroyed three times.
    repeats:
      count: 3
      cluster: per-repeat
    noop:
      infra:
        cluster:
          configuration: dummy
          sandboxed-nodes: 10
