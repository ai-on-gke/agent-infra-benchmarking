# Named benchmark runs, each picked by the scenario-runner's --scenario:
#
#   python3 -m scenario_runner.cli.run --scenario glutton ...
#
# `type` picks scenario_runner/src/scenario_runner/<type>.py, '-' spelled '_',
# which documents the rest.
# For locust: `worker-count` and `sandbox-class` shape the WorkerPool, and
# every key in `master` and `worker` becomes `--key=value` on that process.
# For sandbox-benchmark: `comparator.tests` names ai-sandbox-benchmark's tests
# by function name, run `comparator.runs` times each, and `env-worker-count`
# and `actor-memory` size env's WorkerPool and its environments.
# `sandbox-class` has to be the cluster's `sandbox_class`, gvisor by default.
# `noop` is the scenario-runner's alone: it applies and destroys the case's
# cluster, and runs nothing on it.
#
# `max-failure-ratio` is the share of requests, 0 to 1, that may fail before a
# run of the case counts as failed, 0.01 by default; a run that makes no
# requests, or whose load generator raises any exception, fails too. For
# sandbox-benchmark it is the share of test runs.
#
# `repeats` is how many times the case runs, 1 by default, each on its own
# cluster applied for it, or one after another on a --dev-infra's. Above 1,
# they are recorded as <case>-1 to <case>-N.
#
# The scenario-runner installs substrate on the case's cluster before running
# it, unless `skip-substrate-install` is true.
#
# `infra.cluster` is the cluster the case runs on. `name` picks the Terraform
# config in infra/clusters/<name>/, and the rest is optional: `tfvars` a tfvars
# file in that config (or an absolute path), `tfvars_inline` tfvars content, and
# `variables` values passed as TF_VAR_<key>.
#
# Varying the load or the pool means another case, so that every run is
# reproducible from the name it is recorded under: benchmark-test-case is the
# pod label, and test_case the Prometheus label relabeled from it.

cases:
  glutton:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: default.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 1
          sandboxed_min_node_count = 1
          sandboxed_max_node_count = 1
    repeats: 1
    worker-count: 10
    sandbox-class: gvisor
    master:
      run-time: 1m
      users: 10
      spawn-rate: 10
      warm-up: 10s
    worker:
      workload-name: glutton
      workload-template: glutton
      resume-mode: explicit

  glutton-microvm:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: default.tfvars
        tfvars_inline: |
          sandbox_class            = "microvm"
          sandboxed_node_count     = 1
          sandboxed_min_node_count = 1
          sandboxed_max_node_count = 1
    worker-count: 5
    sandbox-class: microvm
    master:
      run-time: 3m
      users: 3
      spawn-rate: 2
    worker:
      workload-name: glutton
      workload-template: glutton
      resume-mode: explicit

  openclaw:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: openclaw.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 1
          sandboxed_min_node_count = 1
          sandboxed_max_node_count = 1
    repeats: 1
    worker-count: 10
    sandbox-class: gvisor
    master:
      run-time: 2m
      users: 3
      spawn-rate: 10
      warm-up: 10s
    worker:
      workload-name: openclaw
      workload-template: openclaw
      # Above the template's OPENCLAW_TIMEOUT_SECS (100), so the actor's own
      # timeout reports a slow turn first.
      workload-timeout: 120s
      resume-mode: explicit
      # Without an egress policy the actors can't reach mock-llm.
      actor-egress-allow: mock-llm.benchmark-workloads.svc.cluster.local

  openclaw-microvm:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: openclaw.tfvars
        tfvars_inline: |
          sandbox_class            = "microvm"
          sandboxed_node_count     = 1
          sandboxed_min_node_count = 1
          sandboxed_max_node_count = 1
    repeats: 1
    worker-count: 10
    sandbox-class: microvm
    master:
      run-time: 2m
      users: 3
      spawn-rate: 10
      warm-up: 10s
    worker:
      workload-name: openclaw
      workload-template: openclaw
      workload-timeout: 120s
      resume-mode: explicit
      actor-egress-allow: mock-llm.benchmark-workloads.svc.cluster.local

  sandbox-benchmark:
    type: sandbox-benchmark
    infra:
      cluster:
        name: common
        tfvars: default.tfvars
        # Two nodes for 31 workers and their 4Gi environments, as one
        # takes openclaw's 10.
        tfvars_inline: |
          sandboxed_node_count     = 2
          sandboxed_min_node_count = 2
          sandboxed_max_node_count = 2
    sandbox-class: gvisor
    # The comparator starts every run at once, each in an environment of its
    # own on a worker of its own: the 4 single-run tests once, the other 9
    # `runs` times.
    env-worker-count: 31
    # The fft tests' 10000x10000 matrices and their transforms take ~2.4 GB.
    actor-memory: 4Gi
    comparator:
      # Not test_llm_generated_primes, which calls OpenAI, nor
      # test_package_installation, which times installs from PyPI: the
      # environments have no egress.
      tests:
      - test_calculate_primes
      - test_improved_calculate_primes
      - test_fft_performance
      - test_fft_multiprocessing_performance
      - test_optimized_example
      - test_list_directory
      - test_resource_intensive_calculation
      - test_startup_time
      - test_suspend_resume
      - test_database_operations
      - test_file_io_performance
      - test_system_info
      - test_container_stability
      runs: 3

  # The scenario-runner's Terraform path on infra/clusters/dummy, which creates
  # no GCP resources and so has nothing to benchmark on.
  dummy:
    type: noop
    repeats: 3
    skip-substrate-install: true
    infra:
      cluster:
        name: dummy
        tfvars_inline: |
          sandboxed_node_count     = 10
          sandboxed_min_node_count = 10
          sandboxed_max_node_count = 10
