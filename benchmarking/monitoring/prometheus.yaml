apiVersion: v1
kind: Namespace
metadata:
  name: benchmarking
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: benchmarking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: benchmarking
# Pod discovery in this namespace is all the scrape jobs here use; nodes are
# discovered through the ClusterRole below.
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: benchmarking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: benchmarking
---
# A node is a cluster-scoped resource. Thus the namespaced Role above cannot
# give access to node discovery or to the kubelet proxy. The cadvisor scrape
# job needs the two permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-benchmarking-nodes
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "nodes/metrics", "pods"]
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-benchmarking-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-benchmarking-nodes
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: benchmarking
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: benchmarking
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      # Port 8001 of the worker Job's pod: the boomer worker's /metrics,
      # where every request row a report reads comes from.
      - job_name: 'boomer-worker'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - benchmarking
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
              - __meta_kubernetes_pod_container_port_number
            action: keep
            regex: boomer-worker;8001
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

          # What the run was, off the pod's own labels. The worker's metric
          # labels are method/name/status/user_class and carry nothing about
          # which run produced them, so these are what tell one run apart
          # from the next:
          #
          #   locust_request_duration_milliseconds_bucket{run_id="...", name="TTFI"}
          - source_labels: [__meta_kubernetes_pod_label_benchmark_run_id]
            action: replace
            target_label: run_id
          # A run is a case, so its name is the whole of what the pod
          # carries: the load and the worker's flags are both in
          # benchmarking/scenarios/scenarios.yaml under it, and a series of
          # runs is grouped by this rather than by users or workload.
          - source_labels: [__meta_kubernetes_pod_label_benchmark_test_case]
            action: replace
            target_label: test_case

      # Control plane: substrate (ate-system) or agent-sandbox (agent-sandbox-system)
      # pods annotate their metrics port with prometheus.io/scrape.
      - job_name: 'control-plane'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - ate-system
                - agent-sandbox-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
            action: replace
            regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
            replacement: '[$2]:$1'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
            action: replace
            regex: (\d+);((([0-9]+?)(\.|$)){4})
            replacement: $2:$1
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: node
          - source_labels: [__meta_kubernetes_pod_phase]
            action: drop
            regex: Pending|Succeeded|Failed

      # The container memory directly from the cAdvisor endpoint of the
      # kubelet. `kubectl top` reads metrics-server, which reports an average
      # across its own window and hides short peaks.
      # container_memory_working_set_bytes is the value that the OOM killer
      # uses.
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          # cAdvisor reports host-level root cgroup metrics (such as Linux kernel
          # PSI pressure stall information) with id="/" and an empty container
          # label. Relabel id="/" to container="node" before dropping empty
          # container labels so host-level pressure and utilization are kept.
          - source_labels: [id]
            regex: ^/$
            target_label: container
            replacement: node
          # cAdvisor sends a very large number of metrics. Keep only the
          # metrics that the benchmarks read: kernel pressure stall (PSI),
          # container network bandwidth, disk I/O, memory RSS/working-set,
          # CPU utilization, CFS throttling, and the node's CPU and memory
          # capacity that utilization is a share of.
          - source_labels: [__name__]
            action: keep
            regex: container_((.*pressure.*)|network_(receive|transmit)_bytes_total|fs_(reads|writes)_bytes_total|memory_rss|memory_working_set_bytes|cpu_usage_seconds_total|cpu_cfs_.*|spec_memory_limit_bytes)|machine_(cpu_cores|memory_bytes)
          # Drop the series that have an empty container label only for cumulative
          # memory working set and CPU usage. cAdvisor gives a rollup for the whole
          # pod cgroup next to the series for each container; keeping both counts
          # the memory/CPU of each pod two times. Dropping empty container on other
          # metrics (such as network or PSI) would drop valid pod/node stats.
          - source_labels: [__name__, container]
            action: drop
            regex: container_(memory_working_set_bytes|cpu_usage_seconds_total);$
---
# Where the tsdb lives, so the runs it recorded survive a restart of its pod.
# It goes with the cluster, like everything else here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: benchmarking
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: benchmarking
  labels:
    app: prometheus
spec:
  replicas: 1
  # The volume is ReadWriteOnce, so the old pod has to let go of it before the
  # new one can mount it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      # The monitoring pool in scenarios/infra/clusters/common/main.tf.
      nodeSelector:
        benchmarking-monitoring: "true"
      tolerations:
      - key: benchmarking-monitoring
        operator: Equal
        value: "true"
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        # The volume mounts owned by root; this makes it writable by the
        # image's nobody user.
        fsGroup: 65534
      containers:
      - name: prometheus
        # The version upstream substrate runs, in the same manifest named above.
        image: prom/prometheus:v3.5.3@sha256:ddc2493835a1509976d5e4e0c94199c4f843ce1f42dd6bcfc8231ba734a93ff7
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus/"
          # The size bound keeps a full volume from stopping ingestion mid-run.
          - "--storage.tsdb.retention.time=30d"
          - "--storage.tsdb.retention.size=18GB"
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 4Gi
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus/
        - name: data
          mountPath: /prometheus/
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: benchmarking
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
