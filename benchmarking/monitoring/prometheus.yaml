apiVersion: v1
kind: Namespace
metadata:
  name: benchmarking
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: benchmarking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: benchmarking
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions", "networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: benchmarking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: benchmarking
---
# A node is a cluster-scoped resource. Thus the namespaced Role above cannot
# give access to node discovery or to the kubelet proxy. The cadvisor scrape
# job needs the two permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-benchmarking-nodes
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "nodes/metrics"]
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-benchmarking-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-benchmarking-nodes
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: benchmarking
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: benchmarking
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - benchmarking
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

      # The telemetry-meter gives its substrate_* counts on port 8889, which
      # the annotation job above collects. It gives its own otelcol_* counters
      # on port 8888. The annotation relabel can name only one port, thus
      # scrape port 8888 here. When a service reports zero volume,
      # otelcol_receiver_accepted_* shows the difference between "sent nothing"
      # and "arrived nowhere".
      - job_name: 'telemetry-meter-self'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - benchmarking
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
              - __meta_kubernetes_pod_container_port_number
            action: keep
            regex: telemetry-meter;8888
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

      # Port 8001 of whichever pod is running the benchmark, which is the
      # boomer worker's own /metrics and the only live endpoint either pod
      # has: the port 8000 the locust container declares is served by
      # common/metrics.py, which this repo does not ship.
      #
      # Both spellings of the label are matched because the two ways to run
      # the benchmark label their pods apart on purpose — `locust` for the
      # Deployment, `locust-job` for the Job, so that the Deployment's
      # Service cannot select a Job's pod. They are the same worker
      # underneath and belong in the same job here.
      - job_name: 'boomer-worker'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - benchmarking
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
              - __meta_kubernetes_pod_container_port_number
            action: keep
            regex: locust(-job)?;8001
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

          # What the run was, off the pod's own labels. The worker's metric
          # labels are method/name/status/user_class and carry nothing about
          # which run produced them, so these are what tell one session apart
          # from the next:
          #
          #   locust_request_duration_milliseconds_bucket{run_id="...", name="TTFI"}
          #
          # A Deployment pod carries none of them and simply has none of these
          # labels, which is the honest answer for a session that was steered
          # from the web UI and has no fixed shape to record.
          - source_labels: [__meta_kubernetes_pod_label_benchmark_run_id]
            action: replace
            target_label: run_id
          # A Job run is a case, read inside the pod, so its name is the whole
          # of what the pod carries: the load and the worker's flags are both
          # in benchmarking/tests.yaml under it, and a series of runs is
          # grouped by this rather than by users or workload.
          - source_labels: [__meta_kubernetes_pod_label_benchmark_test_case]
            action: replace
            target_label: test_case
          # A Deployment pod labels the workload directly, having no case to
          # read; a Job pod carries neither and simply has no such label.
          - source_labels: [__meta_kubernetes_pod_label_benchmark_workload]
            action: replace
            target_label: workload
          - source_labels: [__meta_kubernetes_pod_label_benchmark_template]
            action: replace
            target_label: template

      # The container memory directly from the cAdvisor endpoint of the
      # kubelet. `kubectl top` reads metrics-server, which reports an average
      # across its own window and hides short peaks.
      # container_memory_working_set_bytes is the value that the OOM killer
      # uses.
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          # cAdvisor reports host-level root cgroup metrics (such as Linux kernel
          # PSI pressure stall information) with id="/" and an empty container
          # label. Relabel id="/" to container="node" before dropping empty
          # container labels so host-level pressure and utilization are kept.
          - source_labels: [id]
            regex: ^/$
            target_label: container
            replacement: node
          # cAdvisor sends a very large number of metrics. Keep only the
          # metrics that the benchmarks read: kernel pressure stall (PSI),
          # container network bandwidth, disk I/O, memory RSS/working-set,
          # CPU utilization, and CFS throttling.
          - source_labels: [__name__]
            action: keep
            regex: container_((.*pressure.*)|network_(receive|transmit)_bytes_total|fs_(reads|writes)_bytes_total|memory_rss|memory_working_set_bytes|cpu_usage_seconds_total|cpu_cfs_.*|spec_memory_limit_bytes)
          # Drop the series that have an empty container label only for cumulative
          # memory working set and CPU usage. cAdvisor gives a rollup for the whole
          # pod cgroup next to the series for each container; keeping both counts
          # the memory/CPU of each pod two times. Dropping empty container on other
          # metrics (such as network or PSI) would drop valid pod/node stats.
          - source_labels: [__name__, container]
            action: drop
            regex: container_(memory_working_set_bytes|cpu_usage_seconds_total);$
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: benchmarking
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          # Deliberately unmounted: the tsdb is written to the container's own
          # filesystem and goes with the pod. Sessions accumulate for as long
          # as one pod lives, which covers comparing a morning's runs and is
          # not a record to keep — the log of each Job is the durable artifact.
          # A PersistentVolumeClaim here changes that, and then this Deployment
          # needs strategy: Recreate, since an RWO volume cannot be held by the
          # old and new pods at once during a rolling update.
          - "--storage.tsdb.path=/prometheus/"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus/
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: benchmarking
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
