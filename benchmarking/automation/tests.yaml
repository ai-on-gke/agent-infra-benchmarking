# Named benchmark runs. Each case is the --test-case JSON of
# benchmarking/run_benchmark.sh, and its name the --test-case-name:
#
#   ./benchmarking/run_benchmark.sh --test-case-name glutton \
#     --test-case "$(yq -c '.cases.glutton' benchmarking/automation/tests.yaml)"
#
# `type` picks benchmarking/<type>/run_benchmark.sh, which documents the rest.
# For locust: `worker-count` and `sandbox-class` shape the WorkerPool, and
# every key in `master` and `worker` becomes `--key=value` on that process.
# `noop` is the orchestrator's alone: it applies and destroys the case's
# cluster, and runs nothing on it.
#
# `repeats` is how many times the case runs. Nothing reads it yet.
#
# `infra.cluster` is the cluster the case runs on, which run_benchmark.sh
# ignores. `name` picks the Terraform config in infra/clusters/<name>/, and the
# rest is optional: `tfvars` a tfvars file in that config (or an absolute path),
# `tfvars_inline` tfvars content, and `variables` values passed as TF_VAR_<key>.
#
# Varying the load or the pool means another case, so that every run is
# reproducible from the name it is recorded under: benchmark-test-case is the
# pod label, and test_case the Prometheus label relabeled from it.

cases:
  glutton:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: default.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 10
          sandboxed_min_node_count = 10
          sandboxed_max_node_count = 10
    repeats: 3
    worker-count: 30
    sandbox-class: gvisor
    master:
      run-time: 1m
      users: 30
      spawn-rate: 10
      warm-up: 10s
    worker:
      workload-name: glutton
      workload-template: glutton
      resume-mode: explicit

  openclaw:
    type: locust
    infra:
      cluster:
        name: common
        tfvars: default.tfvars
        tfvars_inline: |
          sandboxed_node_count     = 10
          sandboxed_min_node_count = 10
          sandboxed_max_node_count = 10
    repeats: 3
    worker-count: 100
    sandbox-class: gvisor
    master:
      run-time: 3m
      users: 100
      spawn-rate: 10
      warm-up: 30s
    worker:
      workload-name: openclaw
      workload-template: openclaw
      workload-timeout: 120s
      resume-mode: explicit

  # The orchestrator's Terraform path on infra/clusters/dummy, which creates no
  # GCP resources and so has nothing to benchmark on.
  dummy:
    type: noop
    infra:
      cluster:
        name: dummy
        tfvars_inline: |
          sandboxed_node_count     = 10
          sandboxed_min_node_count = 10
          sandboxed_max_node_count = 10
