# The run-to-completion counterpart of deployment.yaml: the same benchmark,
# ended by its own clock rather than held open for an operator.
#
# One container rather than the Deployment's two. /app/runner.py owns both
# processes here, which is what lets the pod finish: a Job's pod is done only
# once every container has exited, and two peer containers would each have to
# decide to stop on their own. See that file for the shutdown ordering.
#
# The duration, the user count, the workload and the template are baked in at
# apply time, where the web UI would otherwise carry them, so a run is
# described entirely by the manifest that started it. There is no Service and
# no UI; the results of a run are the logs of its pod.
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-job
  namespace: benchmarking
spec:
  # A benchmark that died partway is not one to quietly run again: the actors
  # it abandoned and the rows it already reported would both carry into the
  # retry, and the second run's numbers would be read as the first's.
  backoffLimit: 0
  # The logs are the results and they live in the pod, so the pod outlives the
  # run by a day rather than being collected as soon as it ends.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        # Deliberately not `app: locust`. The Service in deployment.yaml
        # selects that label, and would otherwise publish the web UI's port at
        # a pod that is running headless and has no web UI behind it.
        #
        # Prometheus is told about both spellings, so this pod is scraped by
        # the same job as the Deployment's. There are no prometheus.io
        # annotations here for that reason: they would add a second scrape of
        # the one endpoint this pod serves, under a second job name.
        app: locust-job
        # What the run was, carried as labels so Prometheus can relabel them
        # onto every series the run produces. The worker's own metric labels
        # are fixed upstream at method/name/status/user_class and say nothing
        # about which run they came from, so without these one run is told
        # from another only by the generated pod name.
        #
        # The values are constrained by what a label may hold — 63 characters
        # of alphanumerics, dashes, underscores and dots — which the run id is
        # checked against in deploy.sh. The others are safe by construction:
        # a duration, a count, and two names that have to match a resource.
        benchmark-run-id: "${BENCHMARK_RUN_ID}"
        benchmark-users: "${BENCHMARK_USERS}"
        benchmark-duration: "${BENCHMARK_DURATION}"
        benchmark-workload: "${BENCHMARK_WORKLOAD_NAME}"
        # Empty when the workload was left to choose, which is a valid label
        # value and one Prometheus drops rather than stores as empty.
        benchmark-template: "${BENCHMARK_WORKLOAD_TEMPLATE}"
    spec:
      restartPolicy: Never
      containers:
      - name: runner
        image: ${LOCUST_IMAGE}
        imagePullPolicy: Always
        command: ["python3", "/app/runner.py"]
        args:
        - "-f"
        - "/app/tests/${BENCHMARK_USER_CLASS}.py"
        - "-t"
        - "${BENCHMARK_DURATION}"
        - "-u"
        - "${BENCHMARK_USERS}"
        # Resolved to a concrete number by deploy.sh, defaulting to the user
        # count so every user starts at the first dispatch. Stated rather than
        # left to locust, whose own default of 1/s would ramp a large run for
        # longer than the run spends measuring.
        - "-r"
        - "${BENCHMARK_SPAWN_RATE}"
        # Read only when the user class is runworkload; the other classes
        # parse these and ignore them. Stated rather than defaulted so the
        # applied manifest names what was measured. An empty template asks the
        # workload for its own.
        - "--workload-name=${BENCHMARK_WORKLOAD_NAME}"
        - "--workload-template=${BENCHMARK_WORKLOAD_TEMPLATE}"
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317
        ports:
        # The worker's own diagnostics. The master's aggregate endpoint on
        # 8000 is not exposed here: a run this short is over before a scrape
        # interval makes much of it, and the aggregate is printed to the log
        # when the run ends.
        - name: boomer-prom
          containerPort: 8001
          protocol: TCP
        volumeMounts:
        - name: servicedns-ca
          mountPath: /run/servicedns-ca
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        resources:
          requests:
            cpu: "1"
            memory: "768Mi"

      volumes:
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: ca.crt
      # The benchmark's client identity, presented to ateapi over mTLS.
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
---
# The Job's own binding to the Role the Deployment's pod also uses. Duplicated
# rather than shared with deployment.yaml so that deleting either path leaves
# the other one working: both name the `default` service account, so a single
# binding would disappear from under whichever path did not delete it.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: benchmarking-job-permissions
  namespace: ate-system
subjects:
- kind: ServiceAccount
  name: default
  namespace: benchmarking
roleRef:
  kind: Role
  name: atelet-endpointslices
  apiGroup: rbac.authorization.k8s.io
