# The locust master of one benchmark run, ended by its own clock. Rendered and
# submitted by scenario_runner/src/scenario_runner/benchmarks/locust.py, which
# starts worker-job.yaml once this pod is ready. The run's results are this
# pod's log and the CSVs it uploads.
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-master
  namespace: benchmarking
spec:
  # A benchmark that died partway is not one to quietly run again.
  backoffLimit: 0
  # The log is the result and lives in the pod, so the pod outlives the run by
  # a day.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        # What the Service below selects on.
        app: locust-master
        benchmark-run-id: "${BENCHMARK_RUN_ID}"
        benchmark-test-case: "${BENCHMARK_RECORD_NAME}"
        benchmark-provider: "${BENCHMARK_PROVIDER}"
    spec:
      restartPolicy: Never
      # The account the bucket's objectCreator grant names, for the upload.
      serviceAccountName: ${BENCHMARK_RUNNER_KSA}
      # The master needs no Kubernetes API.
      automountServiceAccountToken: false
      # Time for a stopped run to wind down as one that ran its course does:
      # the locustfile's stop_workers waits out the worker's actor teardown
      # (up to 60s), then run_master.py waits for the last scrape (15s) and
      # uploads the reports. scenario_runner's locust.STOP_TIMEOUT_SECS waits
      # a little longer than this.
      terminationGracePeriodSeconds: 120
      containers:
      - name: locust
        image: ${LOCUST_IMAGE}
        imagePullPolicy: Always
        # The load, from the test case; the image's entrypoint runs locust.
        args: ${LOCUST_MASTER_ARGS}
        env:
        # Where run_master.py uploads locust's CSVs; empty keeps them here.
        - name: REPORT_BUCKET
          value: "${BENCHMARK_REPORT_BUCKET}"
        - name: REPORT_PREFIX
          value: "${BENCHMARK_REPORT_PREFIX}"
        - name: BENCHMARK_RUN_ID
          value: "${BENCHMARK_RUN_ID}"
        - name: BENCHMARK_TEST_CASE
          value: "${BENCHMARK_RECORD_NAME}"
        # The case this is a run of, and which repeat; 0 for a case run once.
        # run_master.py writes both into run.json.
        - name: BENCHMARK_CASE
          value: "${BENCHMARK_CASE}"
        - name: BENCHMARK_REPEAT
          value: "${BENCHMARK_REPEAT}"
        - name: BENCHMARK_PROVIDER
          value: "${BENCHMARK_PROVIDER}"
        # The share of requests that may fail before run_master.py fails the
        # run; locust itself exits 0 whatever failed (--exit-code-on-error 0).
        - name: MAX_FAILURE_RATIO
          value: "${MAX_FAILURE_RATIO}"
        # What the scenario-runner knows about the run (the case, the cluster
        # and nodes, the templates, the images by digest, the commits), as
        # base64 JSON. run_master.py writes it into run.json.
        - name: BENCHMARK_RUN_INFO
          value: "${BENCHMARK_RUN_INFO}"
        # locust's own --only-summary. "false" is spelled out because locust
        # rejects an empty value instead of reading it as unset.
        - name: LOCUST_ONLY_SUMMARY
          value: "${BENCHMARK_ONLY_SUMMARY}"
        ports:
        - name: locust-master
          containerPort: 5557
          protocol: TCP
        # Ready once locust listens, which is when
        # scenario_runner/src/scenario_runner/benchmarks/locust.py starts the
        # worker: boomer tries the master once and does not retry.
        readinessProbe:
          tcpSocket:
            port: locust-master
          periodSeconds: 2
        resources:
          requests:
            cpu: "1"
            memory: "512Mi"
---
# The account both Jobs run as. Here rather than in worker-job.yaml because this
# Job is applied first. benchmarking/scenarios/infra/clusters/common grants
# this exact namespace/name pair objectCreator on the bucket through a
# principal:// subject, so no iam.gke.io annotation is needed here — but the two
# spellings have to agree or the grant lands on nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${BENCHMARK_RUNNER_KSA}
  namespace: benchmarking
---
# Where the worker Job finds the master.
apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: benchmarking
spec:
  selector:
    app: locust-master
  ports:
  - name: locust-master
    port: 5557
    targetPort: locust-master
    protocol: TCP
