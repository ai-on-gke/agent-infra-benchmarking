# The locust master of one benchmark run, ended by its own clock. Rendered and
# submitted by run_benchmark.sh, which starts worker-job.yaml once this pod is
# ready. The run's results are this pod's log and the CSVs it uploads.
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-master
  namespace: benchmarking
spec:
  # A benchmark that died partway is not one to quietly run again.
  backoffLimit: 0
  # The log is the result and lives in the pod, so the pod outlives the run by
  # a day.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        # What the Service below selects on.
        app: locust-master
        benchmark-run-id: "${BENCHMARK_RUN_ID}"
        benchmark-test-case: "${BENCHMARK_RECORD_NAME}"
    spec:
      restartPolicy: Never
      # The account the bucket's objectCreator grant names, for the upload.
      serviceAccountName: ${BENCHMARK_RUNNER_KSA}
      # The master needs no Kubernetes API.
      automountServiceAccountToken: false
      # Time for the locustfile's stop_workers to wait out the worker's actor
      # teardown before the master quits it.
      terminationGracePeriodSeconds: 90
      containers:
      - name: locust
        image: ${LOCUST_IMAGE}
        imagePullPolicy: Always
        # The load, from the test case; the image's entrypoint runs locust.
        args: ${LOCUST_MASTER_ARGS}
        env:
        # Where run_master.py uploads locust's CSVs; empty keeps them here.
        - name: REPORT_BUCKET
          value: "${BENCHMARK_REPORT_BUCKET}"
        - name: BENCHMARK_RUN_ID
          value: "${BENCHMARK_RUN_ID}"
        - name: BENCHMARK_TEST_CASE
          value: "${BENCHMARK_RECORD_NAME}"
        # locust's own --only-summary. "false" is spelled out because locust
        # rejects an empty value instead of reading it as unset.
        - name: LOCUST_ONLY_SUMMARY
          value: "${BENCHMARK_ONLY_SUMMARY}"
        ports:
        - name: locust-master
          containerPort: 5557
          protocol: TCP
        # Ready once locust listens, which is when run_benchmark.sh starts the
        # worker: boomer tries the master once and does not retry.
        readinessProbe:
          tcpSocket:
            port: locust-master
          periodSeconds: 2
        resources:
          requests:
            cpu: "1"
            memory: "512Mi"
---
# The account both Jobs run as. Here rather than in worker-job.yaml because
# this Job is applied first. infra/terraform-gke grants this exact
# namespace/name pair objectCreator on the bucket through a principal://
# subject, so no iam.gke.io annotation is needed here — but the two spellings
# have to agree or the grant lands on nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${BENCHMARK_RUNNER_KSA}
  namespace: benchmarking
---
# Where the worker Job finds the master.
apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: benchmarking
spec:
  selector:
    app: locust-master
  ports:
  - name: locust-master
    port: 5557
    targetPort: locust-master
    protocol: TCP
