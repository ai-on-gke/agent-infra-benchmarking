# The pod runs two containers sharing the network namespace:
#   * locust-master: Python locust master, serves --class-picker UI on :8089
#     and accepts worker connections on :5557. Aggregates stats from the
#     boomer worker and exposes them at /metrics on :8000.
#   * boomer-worker: Go re-implementation of RunWorkloadUser. Connects to the
#     master at localhost:5557 via the locust worker ZMQ protocol; exposes
#     its own per-worker diagnostics at /metrics on :8001 (aggregate stats
#     flow through the master via boomer.RecordSuccess). Talks to the
#     Kubernetes API directly (no ateapi mTLS bundle to project in) through
#     the benchmark-runner ServiceAccount below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-runner
  namespace: benchmarking

---

# Scoped to this namespace only: the benchmark creates/deletes Sandboxes and
# SandboxClaims it owns here, and only needs to read the SandboxTemplate/
# SandboxWarmPool that benchmarking/workloads/deploy.sh already applied.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: benchmark-runner
  namespace: benchmarking
rules:
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxtemplates", "sandboxwarmpools"]
  verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: benchmark-runner
  namespace: benchmarking
subjects:
- kind: ServiceAccount
  name: benchmark-runner
  namespace: benchmarking
roleRef:
  kind: Role
  name: benchmark-runner
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: benchmarking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: locust
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: benchmark-runner
      containers:
      - name: locust-master
        image: ${LOCUST_IMAGE}
        imagePullPolicy: Always
        args:
        - "-m"
        - "locust"
        - "-f"
        - "/app/tests/${BENCHMARK_USER_CLASS}.py"
        - "--master"
        - "--master-bind-host=0.0.0.0"
        env:
        # Optional: point at an OTLP collector reachable from this cluster to
        # get the FirstResume/WarmStart-equivalent span breakdown. Unset is
        # fine — the boomer worker still reports every window through
        # Prometheus and the locust stats CSV either way.
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "${OTEL_COLLECTOR_ENDPOINT}"
        ports:
        - name: prometheus
          containerPort: 8000
          protocol: TCP
        - name: web
          containerPort: 8089
          protocol: TCP
        - name: zmq
          containerPort: 5557
          protocol: TCP
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"

      - name: boomer-worker
        # Same image as the master — the boomer-worker Go binary is baked in
        # at /app/boomer-worker by benchmarking/locust/Dockerfile.
        image: ${LOCUST_IMAGE}
        imagePullPolicy: Always
        command: ["/app/boomer-worker"]
        args:
        - "--prometheus-addr=:8001"
        # Fetch runtime config (trace probability, wait-time bounds) from
        # http://{master-host}:{master-web-port}/boomer-config on each spawn
        # message so values the operator types into the web UI form are
        # honored. The endpoint is served by
        # benchmarking/locust/common/boomer_config.py on the master.
        - "--master-web-port=8089"
        - "--user-class=${BENCHMARK_USER_CLASS}"
        - "--namespace=benchmarking"
        # The workload a RunWorkloadUser drives, and the SandboxTemplate /
        # SandboxWarmPool it is measured against. Read only when the user
        # class is runworkload. deploy.sh's --workload-name and
        # --workload-template set these; an empty template hands the choice
        # to the workload.
        - "--workload-name=${BENCHMARK_WORKLOAD_NAME}"
        - "--workload-template=${BENCHMARK_WORKLOAD_TEMPLATE}"
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "${OTEL_COLLECTOR_ENDPOINT}"
        ports:
        - name: boomer-prom
          containerPort: 8001
          protocol: TCP
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: locust
  namespace: benchmarking
spec:
  selector:
    app: locust
  ports:
  - name: web
    protocol: TCP
    port: 8089
    targetPort: 8089
  - name: prometheus
    protocol: TCP
    port: 8000
    targetPort: 8000
  - name: boomer-prom
    protocol: TCP
    port: 8001
    targetPort: 8001
