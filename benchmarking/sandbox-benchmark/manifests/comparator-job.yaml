# The comparator of one sandbox-benchmark run, which runs ai-sandbox-benchmark's
# tests on one provider, substrate's through env's ate-env-api. Rendered and submitted by
# scenario_runner/src/scenario_runner/sandbox_benchmark.py. The run's results
# are this pod's log and the files run_comparator.py uploads.
apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-benchmark-comparator
  namespace: benchmarking
spec:
  # A benchmark that died partway is not one to quietly run again.
  backoffLimit: 0
  # The log is the result and lives in the pod, so the pod outlives the run by
  # a day.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        benchmark-run-id: "${BENCHMARK_RUN_ID}"
        benchmark-test-case: "${BENCHMARK_RECORD_NAME}"
    spec:
      restartPolicy: Never
      # The account the bucket's objectCreator grant names, for the upload.
      serviceAccountName: ${BENCHMARK_RUNNER_KSA}
      # The comparator calls no Kubernetes API.
      automountServiceAccountToken: false
      # Time for a stopped run to cancel its tests, whose environments are
      # deleted as they end, and upload run.json. sandbox_benchmark.STOP_TIMEOUT_SECS
      # waits a little longer than this.
      terminationGracePeriodSeconds: 120
      containers:
      - name: comparator
        image: ${COMPARATOR_IMAGE}
        imagePullPolicy: Always
        env:
        # What run_comparator.py reads; its docstring says what each is.
        - name: BENCHMARK_PROVIDER
          value: "${BENCHMARK_PROVIDER}"
        - name: BENCHMARK_TESTS
          value: "${BENCHMARK_TESTS}"
        - name: BENCHMARK_RUNS
          value: "${BENCHMARK_RUNS}"
        - name: BENCHMARK_WARMUP_RUNS
          value: "${BENCHMARK_WARMUP_RUNS}"
        - name: MAX_FAILURE_RATIO
          value: "${MAX_FAILURE_RATIO}"
        - name: BENCHMARK_RUN_ID
          value: "${BENCHMARK_RUN_ID}"
        - name: BENCHMARK_RECORD_NAME
          value: "${BENCHMARK_RECORD_NAME}"
        - name: BENCHMARK_CASE
          value: "${BENCHMARK_CASE}"
        - name: BENCHMARK_REPEAT
          value: "${BENCHMARK_REPEAT}"
        - name: BENCHMARK_RUN_INFO
          value: "${BENCHMARK_RUN_INFO}"
        - name: REPORT_BUCKET
          value: "${BENCHMARK_REPORT_BUCKET}"
        - name: REPORT_PREFIX
          value: "${BENCHMARK_REPORT_PREFIX}"
        - name: BENCHMARK_REPORT_FOLDER
          value: "${BENCHMARK_REPORT_FOLDER}"
        # The substrate provider's, see its providers/README.md.
        - name: SUBSTRATE_ENV_API_ADDR
          value: "${SUBSTRATE_ENV_API_ADDR}"
        - name: SUBSTRATE_ATESPACE
          value: "${SUBSTRATE_ATESPACE}"
        - name: SUBSTRATE_TEMPLATE
          value: "${SUBSTRATE_TEMPLATE}"
        # The keys of a provider that needs them, in the Secret the scenario-runner
        # creates for its run; sandbox_benchmark.PROVIDER_KEYS.
        - name: E2B_API_KEY
          valueFrom:
            secretKeyRef:
              name: sandbox-benchmark-providers
              key: E2B_API_KEY
              optional: true
        - name: DAYTONA_API_KEY
          valueFrom:
            secretKeyRef:
              name: sandbox-benchmark-providers
              key: DAYTONA_API_KEY
              optional: true
        # The comparator requires it although the daytona provider defaults to it.
        - name: DAYTONA_SERVER_URL
          value: "https://app.daytona.io/api"
        - name: MODAL_TOKEN_ID
          valueFrom:
            secretKeyRef:
              name: sandbox-benchmark-providers
              key: MODAL_TOKEN_ID
              optional: true
        - name: MODAL_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: sandbox-benchmark-providers
              key: MODAL_TOKEN_SECRET
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: sandbox-benchmark-providers
              key: ANTHROPIC_API_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: sandbox-benchmark-providers
              key: OPENAI_API_KEY
              optional: true
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
---
# The account the Job runs as, also in locust/manifests/master-job.yaml.
# benchmarking/scenarios/infra/clusters/common grants this exact
# namespace/name pair objectCreator on the bucket through a principal://
# subject, so no iam.gke.io annotation is needed here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${BENCHMARK_RUNNER_KSA}
  namespace: benchmarking
