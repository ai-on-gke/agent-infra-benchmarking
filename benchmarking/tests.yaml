# Named benchmark runs, one at a time:
#
#   ./benchmarking/run_locust_job.sh --test-case glutton-implicit
#
# A case is the whole run. `duration` and `users` are required and `spawn-rate`
# defaults to `users`, which starts the whole load at once; those three are the
# load.
#
# `worker-count` and `sandbox-class` shape the WorkerPool, which
# run_locust_job.sh deletes and recreates before every run. They default to 1
# and gvisor. `sandbox-class` has to match the class the ActorTemplates were
# deployed with: a snapshot cannot be restored across runtimes, so actors never
# schedule onto a pool of the other class.
#
# Every other key becomes a boomer-worker flag, `key: value` to `--key=value`,
# and nothing here reads them — a flag the worker accepts works from a case the
# day it is added, and one it does not is fatal in the worker, which lists the
# ones it knows. `boomer-worker --help` is that set.
#
# Varying the load or the pool means another case, so that every run is
# reproducible from the name it is recorded under: benchmark-test-case is the
# pod label, and test_case the Prometheus label relabeled from it.

cases:
  # The default shape: actors woken by an explicit ResumeActor before the
  # instruction goes out.
  glutton-baseline:
    duration: 1m
    users: 5
    worker-count: 15
    sandbox-class: gvisor
    workload-name: glutton
    workload-template: glutton
    resume-mode: explicit

  # No wake request at all — the router resumes the actor while holding the
  # instruction. TTFI goes to near zero here and the number to read is
  # ExecutionTime, so this is not the baseline's rows at a different value;
  # it measures whether the parked path costs what the explicit one does.
  glutton-implicit:
    duration: 5m
    users: 50
    worker-count: 1
    sandbox-class: gvisor
    workload-name: glutton
    workload-template: glutton
    resume-mode: implicit

  # Think time between a VU's iterations, so actors spend time suspended
  # rather than cycling as fast as the control plane answers.
  glutton-idle:
    duration: 5m
    users: 50
    worker-count: 1
    sandbox-class: gvisor
    workload-name: glutton
    workload-template: glutton
    resume-mode: explicit
    min-wait: 2s
    max-wait: 10s


  # The other workload. Its template is not in the default WORKLOAD_TEMPLATES
  # set, so deploy it first with WORKLOAD_TEMPLATES="glutton openclaw".
  openclaw-baseline:
    duration: 5m
    users: 50
    worker-count: 1
    sandbox-class: gvisor
    workload-name: openclaw
    workload-template: openclaw
    resume-mode: explicit

  # Measures the ramp rather than a fixed load: users arrive at 5/s, so the
  # first 20s are a pool taking activations faster than it can serve them.
  glutton-ramp:
    duration: 10m
    users: 100
    spawn-rate: 5
    worker-count: 2
    sandbox-class: gvisor
    workload-name: glutton
    workload-template: glutton

  # Oversubscription: more actors than a small pool holds active, so the
  # queueing shows up as latency. That is what `worker-count` below is for —
  # 200 users onto 2 workers.
  glutton-scale:
    duration: 10m
    users: 200
    worker-count: 2
    sandbox-class: gvisor
    workload-name: glutton
    workload-template: glutton
