# RBAC the --backend agent-sandbox boomer-worker needs. Unlike the substrate
# backend (which reaches ateapi over mTLS with a projected pod identity), this
# backend talks to the Kubernetes API directly through this ServiceAccount:
# runworkload creates and deletes the Sandboxes/SandboxClaims it measures, and
# reads the SandboxTemplate/SandboxWarmPool that workloads/deploy.sh --backend
# agent-sandbox already applied. Applied by that same script; a run pod (or a
# manual boomer-worker) sets serviceAccountName: benchmark-runner to assume it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-runner
  namespace: benchmarking
---
# Scoped to this namespace only: the benchmark owns the Sandboxes and
# SandboxClaims it creates here, and only reads the template/pool.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: benchmark-runner
  namespace: benchmarking
rules:
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxtemplates", "sandboxwarmpools"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: benchmark-runner
  namespace: benchmarking
subjects:
- kind: ServiceAccount
  name: benchmark-runner
  namespace: benchmarking
roleRef:
  kind: Role
  name: benchmark-runner
  apiGroup: rbac.authorization.k8s.io
